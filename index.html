<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مار نئونی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ===== استایل‌های پایه (همان‌ها) ===== */
  :root{
    --bg:#05060a;
    --grid:#0b0f16;
    --grid-line:#121a26;
    --cyan:#00f0ff;
    --magenta:#ff2ec4;
    --gold:#ffd60a;
    --danger:#ff4d4d;
    --text:#dfe9f2;
    --muted:#5c7089;
    --shadow-cyan:rgba(0,240,255,0.3);
    --shadow-magenta:rgba(255,46,196,0.3);
    --panel-bg:rgba(11,15,22,0.7);
    --star-color:rgba(255,255,255,0.6);
  }
  body.day-mode{
    --bg:#e8edf2;
    --grid:#d5dce3;
    --grid-line:#b8c3ce;
    --cyan:#0077be;
    --magenta:#c2185b;
    --gold:#e6a800;
    --danger:#c62828;
    --text:#1a1a2e;
    --muted:#5a6a7a;
    --shadow-cyan:rgba(0,119,190,0.2);
    --shadow-magenta:rgba(194,24,91,0.2);
    --panel-bg:rgba(200,210,220,0.7);
    --star-color:rgba(0,0,0,0.15);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:background 0.4s ease, color 0.3s ease;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:10px 14px 8px;
    background:var(--bg);
    min-height:100%;
    position:relative;
    transition:background 0.6s ease;
  }
  #starfield{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:var(--star-color);
    transition:opacity 1.5s ease;
  }
  .title{
    font-family:'Press Start 2P',monospace;
    font-size:15px;
    letter-spacing:1px;
    color:var(--cyan);
    text-shadow:0 0 6px var(--cyan), 0 0 18px var(--shadow-cyan);
    margin:2px 0 8px;
    text-align:center;
    direction:ltr;
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .title .btn-icon{
    background:transparent;
    border:1.5px solid var(--muted);
    color:var(--muted);
    border-radius:50%;
    width:32px;
    height:32px;
    font-size:16px;
    cursor:pointer;
    transition:all 0.3s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .title .btn-icon:hover{
    border-color:var(--cyan);
    color:var(--cyan);
    transform:scale(1.1);
  }
  .hud{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    direction:ltr;
    flex-wrap:wrap;
    justify-content:center;
    z-index:1;
    position:relative;
  }
  .hud .box{
    background:var(--panel-bg);
    border:1px solid var(--grid-line);
    padding:5px 10px;
    border-radius:6px;
    text-align:center;
    min-width:60px;
    backdrop-filter:blur(4px);
    transition:all 0.3s;
  }
  .hud .box span{display:block;margin-top:3px;}
  .hud .score span{color:var(--cyan);text-shadow:0 0 6px var(--shadow-cyan);}
  .hud .best span{color:var(--gold);text-shadow:0 0 6px var(--gold);}
  .hud .label{color:var(--muted);font-size:8px;}
  .hud .box.power-indicator{
    min-width:40px;
    font-size:14px;
    line-height:1;
    padding:4px 8px;
  }
  .btn-pause{
    background:transparent;
    border:1.5px solid var(--muted);
    color:var(--muted);
    padding:5px 10px;
    border-radius:6px;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
    cursor:pointer;
    transition:all 0.3s;
  }
  .btn-pause:hover{color:var(--cyan);border-color:var(--cyan);}
  .board-wrap{
    position:relative;
    border:2px solid var(--grid-line);
    border-radius:10px;
    box-shadow:0 0 0 1px var(--shadow-cyan), 0 0 24px var(--shadow-cyan), inset 0 0 24px rgba(0,0,0,0.3);
    background:var(--grid);
    max-width:94vw;
    touch-action:none;
    transition:border-color 0.4s, box-shadow 0.4s;
    z-index:1;
  }
  canvas{
    display:block;
    border-radius:8px;
    max-width:94vw;
    height:auto;
    touch-action:none;
  }
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(3,5,9,0.88);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    padding:20px;
    backdrop-filter:blur(3px);
    z-index:10;
  }
  .overlay.hidden{display:none;}
  .overlay h2{
    font-family:'Press Start 2P',monospace;
    font-size:16px;
    color:var(--magenta);
    text-shadow:0 0 8px var(--shadow-magenta), 0 0 20px var(--shadow-magenta);
    margin:0;
    direction:ltr;
  }
  .overlay p{margin:0;color:var(--muted);font-size:13px;max-width:280px;line-height:1.9;}
  .btn{
    font-family:'Vazirmatn',sans-serif;
    font-weight:600;
    font-size:14px;
    background:transparent;
    color:var(--cyan);
    border:1.5px solid var(--cyan);
    padding:10px 26px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px var(--shadow-cyan);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover{box-shadow:0 0 18px var(--shadow-cyan);}
  .btn:active{transform:scale(0.96);}
  .controls-panel{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:6px;
    background:var(--panel-bg);
    border:1px solid var(--grid-line);
    border-radius:8px;
    padding:5px 12px;
    backdrop-filter:blur(4px);
    flex-wrap:wrap;
    justify-content:center;
    z-index:1;
    transition:all 0.3s;
  }
  .controls-panel label{
    color:var(--muted);
    font-size:11px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .controls-panel input[type="text"]{
    width:26px;
    height:26px;
    background:var(--grid);
    border:1px solid var(--grid-line);
    border-radius:4px;
    color:var(--text);
    font-size:15px;
    text-align:center;
    font-weight:bold;
    padding:0;
  }
  .controls-panel input[type="color"]{
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    cursor:pointer;
    padding:0;
    border-radius:4px;
  }
  .controls-panel input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
  .controls-panel input[type="color"]::-webkit-color-swatch{border:1px solid var(--grid-line);border-radius:4px;}
  .controls-panel select{
    background:var(--grid);
    color:var(--text);
    border:1px solid var(--grid-line);
    border-radius:4px;
    padding:3px 5px;
    font-size:11px;
    font-family:'Vazirmatn',sans-serif;
  }
  .filter-btns{
    display:flex;
    gap:4px;
  }
  .filter-btns .fbtn{
    background:transparent;
    border:1px solid var(--grid-line);
    color:var(--muted);
    border-radius:4px;
    padding:3px 7px;
    font-size:9px;
    cursor:pointer;
    transition:all 0.2s;
    font-family:'Vazirmatn',sans-serif;
  }
  .filter-btns .fbtn.active{
    border-color:var(--cyan);
    color:var(--cyan);
    box-shadow:0 0 8px var(--shadow-cyan);
  }
  .filter-btns .fbtn:hover{border-color:var(--text);}
  .legend{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
    max-width:340px;
    z-index:1;
  }
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.food{background:var(--magenta);box-shadow:0 0 6px var(--shadow-magenta);}
  .dot.speed{background:var(--gold);box-shadow:0 0 6px var(--gold);}
  .dot.double{background:#7cff6b;box-shadow:0 0 6px #7cff6b;}
  .dot.obstacle{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .progress-wrap{
    width:100%;
    max-width:360px;
    height:4px;
    background:var(--grid-line);
    border-radius:4px;
    margin-top:3px;
    overflow:hidden;
    z-index:1;
    position:relative;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--cyan), var(--magenta));
    border-radius:4px;
    transition:width 0.3s ease;
  }
  .combo-text{
    position:absolute;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    font-family:'Press Start 2P',monospace;
    font-size:22px;
    color:var(--gold);
    text-shadow:0 0 20px var(--gold), 0 0 40px var(--gold);
    pointer-events:none;
    opacity:0;
    z-index:20;
    transition:all 0.5s ease;
    direction:ltr;
  }
  .combo-text.show{
    opacity:1;
    transform:translateX(-50%) scale(1.2);
  }

  /* ===== جوی‌استیک ===== */
  .joystick-wrapper {
    position: fixed;
    width: 140px;
    height: 140px;
    z-index: 100;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    user-select: none;
    display: block; /* همیشه نمایش داده شود */
  }
  .joystick-wrapper.dragging {
    cursor: grabbing;
    opacity: 0.85;
  }
  .joystick-base {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #0d1723 0%, var(--grid) 70%);
    border: 2px solid var(--grid-line);
    box-shadow: 0 0 0 1px var(--shadow-cyan), 0 0 30px rgba(0,240,255,0.15), inset 0 0 30px rgba(0,0,0,0.6);
    position: relative;
    touch-action: none;
    pointer-events: auto;
  }
  .joystick-arrow {
    position: absolute;
    color: var(--muted);
    pointer-events: none;
    line-height: 0;
  }
  .joystick-arrow svg { display: block; width: 16px; height: 16px; fill: currentColor; }
  .joystick-arrow.right svg { transform: rotate(90deg); }
  .joystick-arrow.down svg { transform: rotate(180deg); }
  .joystick-arrow.left svg { transform: rotate(270deg); }
  .joystick-arrow.up { top: 12px; left: 50%; transform: translateX(-50%); }
  .joystick-arrow.down { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .joystick-arrow.left { left: 12px; top: 50%; transform: translateY(-50%); }
  .joystick-arrow.right { right: 12px; top: 50%; transform: translateY(-50%); }
  .joystick-stick {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    background: radial-gradient(circle at 35% 30%, #1a2733 0%, var(--grid) 75%);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 20px var(--shadow-cyan);
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease;
    pointer-events: none;
  }
  .joystick-handle {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    background: rgba(0,240,255,0.2);
    border-radius: 50%;
    border: 1px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--cyan);
    cursor: grab;
    touch-action: none;
    pointer-events: auto;
    box-shadow: 0 0 10px var(--shadow-cyan);
  }
  .joystick-handle:active { cursor: grabbing; }

  /* فقط در گوشی نمایش داده شود (اختیاری) */
  @media (hover:none) and (pointer:coarse) {
    .joystick-wrapper {
      display: block;
    }
  }
  @media (max-width:500px){
    .title{font-size:12px;gap:8px;}
    .title .btn-icon{width:28px;height:28px;font-size:14px;}
    .hud .box{min-width:50px;padding:4px 8px;font-size:8px;}
    .controls-panel{padding:4px 10px;gap:6px;}
    .controls-panel label{font-size:10px;}
    .joystick-wrapper { width: 120px; height: 120px; }
    .joystick-stick { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<div id="starfield"></div>
<div class="title">
  <span>NEON SNAKE</span>
  <button class="btn-icon" id="themeToggle" title="تغییر تم">🌙</button>
  <button class="btn-icon" id="fullscreenBtn" title="تمام‌صفحه">⛶</button>
</div>
<div class="hud">
  <div class="box score"><span class="label">امتیاز</span><span id="score">0</span></div>
  <div class="box best"><span class="label">بهترین</span><span id="best">0</span></div>
  <div class="box power-indicator" id="powerIcon">⚡</div>
  <button class="btn-pause" id="pauseBtn">⏸ توقف</button>
</div>
<div class="board-wrap">
  <canvas id="board" width="360" height="360"></canvas>
  <div class="combo-text" id="comboText">🔥 COMBO!</div>
  <div class="overlay" id="startOverlay">
    <h2>NEON SNAKE</h2>
    <p>حرکت با فلش‌ها یا WASD • غذا بخور • پاورآپ بگیر • تا جایی که می‌تونی دوام بیار!</p>
    <button class="btn" id="startBtn">شروع بازی</button>
  </div>
  <div class="overlay hidden" id="overOverlay">
    <h2>GAME OVER</h2>
    <p id="finalScoreText">امتیاز: 0</p>
    <button class="btn" id="restartBtn">دوباره بازی کن</button>
  </div>
  <div class="overlay hidden" id="pauseOverlay">
    <h2 style="color:var(--cyan);text-shadow:0 0 8px var(--shadow-cyan);">⏸ توقف</h2>
    <p>بازی موقتاً متوقف شده.</p>
  </div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="controls-panel">
  <label>حرف: <input type="text" id="skinLetter" maxlength="1" value="M"></label>
  <label>رنگ: <input type="color" id="skinColor" value="#00f0ff"></label>
  <label>طرح:
    <select id="skinPattern">
      <option value="simple">ساده</option>
      <option value="dotted">خال‌خالی</option>
      <option value="striped">خط‌چین</option>
      <option value="checkered">شطرنجی</option>
    </select>
  </label>
  <div class="filter-btns">
    <button class="fbtn active" data-filter="normal">نرمال</button>
    <button class="fbtn" data-filter="cinema">سینمایی</button>
    <button class="fbtn" data-filter="neon">نئون</button>
    <button class="fbtn" data-filter="mono">تک‌رنگ</button>
  </div>
</div>
<div class="legend">
  <span><i class="dot food"></i> غذا</span>
  <span><i class="dot speed"></i> سرعت</span>
  <span><i class="dot double"></i> دوبل</span>
  <span><i class="dot obstacle"></i> مانع</span>
  <span id="obstacleCount">🚧 ۳</span>
</div>

<!-- ===== فقط جوی‌استیک (بدون دکمه‌های فلش و بدون انتخابگر) ===== -->
<div class="joystick-wrapper" id="joystickWrapper">
  <div class="joystick-base" id="joystickBase">
    <div class="joystick-arrow up"><svg viewBox="0 0 24 24"><path d="M12 4 L20 18 L4 18 Z"/></svg></div>
    <div class="joystick-arrow right"><svg viewBox="0 0 24 24"><path d="M12 4 L20 18 L4 18 Z"/></svg></div>
    <div class="joystick-arrow down"><svg viewBox="0 0 24 24"><path d="M12 4 L20 18 L4 18 Z"/></svg></div>
    <div class="joystick-arrow left"><svg viewBox="0 0 24 24"><path d="M12 4 L20 18 L4 18 Z"/></svg></div>
    <div class="joystick-stick" id="joystickStick"></div>
    <div class="joystick-handle" id="joystickHandle">⣿</div>
  </div>
</div>

<script>
(function(){
  // ---- عناصر ----
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScoreText = document.getElementById('finalScoreText');
  const pauseBtn = document.getElementById('pauseBtn');
  const progressBar = document.getElementById('progressBar');
  const comboText = document.getElementById('comboText');
  const powerIcon = document.getElementById('powerIcon');
  const obstacleCountEl = document.getElementById('obstacleCount');
  const themeToggle = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  const joystickWrapper = document.getElementById('joystickWrapper');
  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  const joystickHandle = document.getElementById('joystickHandle');

  // ---- تنظیمات ----
  const COLORS = { food: '#ff2ec4', speed: '#ffd60a', double: '#7cff6b', obstacle: '#ff4d4d' };
  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS;
  let best = 0;
  let skin = { letter: 'M', color: '#00f0ff', pattern: 'simple' };
  let currentFilter = 'normal';
  let isDay = false;

  // ---- متغیرهای بازی ----
  let snake, dir, nextDir, food, obstacles, powerUp, score;
  let levelInterval = 230;
  const MIN_INTERVAL = 110;
  let currentInterval = levelInterval;
  let lastStep = 0;
  let running = false, paused = false;
  let doubleScoreUntil = 0, speedBoostUntil = 0;
  let powerUpTimer = null, rafId = null;
  let comboCount = 0;
  let particles = [];
  let stars = [];

  // ---- جوی‌استیک ----
  let joystickActive = false;
  let joystickAnchor = {x:0,y:0};
  const JOY_RADIUS = 45;
  let isDraggingJoystick = false;
  let dragOffsetX = 0, dragOffsetY = 0;

  // ---- best از localStorage ----
  function loadBest(){
    try { const s = localStorage.getItem('neon_snake_best'); best = s ? parseInt(s,10) : 0; } catch(e){ best=0; }
    bestEl.textContent = best;
  }
  function saveBest(){ try { localStorage.setItem('neon_snake_best', String(best)); } catch(e){} }
  loadBest();

  // ---- ستاره‌ها ----
  function initStars(){
    const container = document.getElementById('starfield');
    container.innerHTML = '';
    stars = [];
    for(let i=0;i<50;i++){
      const el = document.createElement('div');
      el.className = 'star';
      const size = 1 + Math.random() * 3;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const delay = Math.random() * 3;
      const duration = 1.5 + Math.random() * 3;
      el.style.cssText = `
        width:${size}px; height:${size}px;
        left:${x}%; top:${y}%;
        animation: twinkle ${duration}s ease-in-out ${delay}s infinite alternate;
        opacity:${0.2 + Math.random() * 0.5};
      `;
      container.appendChild(el);
      stars.push({ el, baseOpacity: 0.2 + Math.random() * 0.5, duration, delay });
    }
    if(!document.getElementById('starStyle')){
      const style = document.createElement('style');
      style.id = 'starStyle';
      style.textContent = `
        @keyframes twinkle {
          0% { opacity: 0.15; transform: scale(0.8); }
          100% { opacity: 0.9; transform: scale(1.2); }
        }
      `;
      document.head.appendChild(style);
    }
  }
  initStars();

  // ---- توابع اصلی بازی (همان‌ها) ----
  function randCell(exclude){
    const total = COLS * ROWS;
    const free = [];
    for(let i=0;i<total;i++){
      const x = i % COLS, y = Math.floor(i / COLS);
      if(!exclude.some(c => c && c.x === x && c.y === y)) free.push({x,y});
    }
    if(free.length === 0) return { x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS) };
    return free[Math.floor(Math.random() * free.length)];
  }

  function spawnFood(){
    const exclude = [...snake, ...obstacles];
    if(powerUp) exclude.push(powerUp);
    food = randCell(exclude);
  }

  function spawnObstacles(count){
    obstacles = [];
    for(let i=0;i<count;i++){
      const exclude = [...snake, ...obstacles];
      if(food) exclude.push(food);
      if(powerUp) exclude.push(powerUp);
      obstacles.push(randCell(exclude));
    }
    obstacleCountEl.textContent = `🚧 ${obstacles.length}`;
  }

  function maybeSpawnPowerUp(){
    if(powerUp || !running || paused) return;
    if(Math.random() < 0.015){
      const type = Math.random() < 0.5 ? 'speed' : 'double';
      const exclude = [...snake, ...obstacles];
      if(food) exclude.push(food);
      powerUp = { ...randCell(exclude), type };
      clearTimeout(powerUpTimer);
      powerUpTimer = setTimeout(() => { powerUp = null; }, 6000);
    }
    updatePowerIcon();
  }

  function updatePowerIcon(){
    if(doubleScoreUntil > Date.now()) powerIcon.textContent = '💎';
    else if(speedBoostUntil > Date.now()) powerIcon.textContent = '⚡';
    else if(powerUp) powerIcon.textContent = '✨';
    else powerIcon.textContent = '⚡';
  }

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; comboCount = 0;
    levelInterval = 230; currentInterval = 230;
    doubleScoreUntil = 0; speedBoostUntil = 0;
    powerUp = null; obstacles = []; food = null;
    particles = [];
    clearTimeout(powerUpTimer);
    spawnFood();
    spawnObstacles(3);
    scoreEl.textContent = score;
    progressBar.style.width = '0%';
    paused = false;
    pauseOverlay.classList.add('hidden');
    pauseBtn.textContent = '⏸ توقف';
    comboText.classList.remove('show');
    updatePowerIcon();
  }

  function gameOver(){
    running = false;
    cancelAnimationFrame(rafId);
    if(score > best){ best = score; bestEl.textContent = best; saveBest(); }
    finalScoreText.textContent = 'امتیاز: ' + score;
    overOverlay.classList.remove('hidden');
    pauseBtn.textContent = '⏸ توقف';
    for(let i=0;i<40;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*60,
        y: canvas.height/2 + (Math.random()-0.5)*60,
        vx: (Math.random()-0.5)*8,
        vy: (Math.random()-0.5)*8 - 2,
        life: 1,
        decay: 0.008 + Math.random()*0.015,
        color: ['#ff2ec4','#00f0ff','#ffd60a','#ff4d4d'][Math.floor(Math.random()*4)],
        size: 3 + Math.random()*5
      });
    }
  }

  function step(){
    if(paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
      gameOver(); return;
    }
    if(snake.some(s => s.x === head.x && s.y === head.y)){
      gameOver(); return;
    }
    if(obstacles.some(o => o.x === head.x && o.y === head.y)){
      gameOver(); return;
    }

    snake.unshift(head);

    let ate = false;
    if(head.x === food.x && head.y === food.y){
      const mult = Date.now() < doubleScoreUntil ? 2 : 1;
      score += 10 * mult;
      scoreEl.textContent = score;
      spawnParticles(head.x * CELL + CELL/2, head.y * CELL + CELL/2, COLORS.food, 30);
      spawnFood();
      ate = true;
      comboCount++;
      if(comboCount >= 3) showCombo(comboCount);
      levelInterval = Math.max(MIN_INTERVAL, levelInterval - 2);
      if(score > 0 && score % 100 === 0 && obstacles.length < 9){
        const exclude = [...snake, food, ...obstacles];
        if(powerUp) exclude.push(powerUp);
        obstacles.push(randCell(exclude));
        obstacleCountEl.textContent = `🚧 ${obstacles.length}`;
      }
      const progress = ((score % 100) / 100) * 100;
      progressBar.style.width = progress + '%';
    } else {
      comboCount = 0;
      comboText.classList.remove('show');
    }

    if(powerUp && head.x === powerUp.x && head.y === powerUp.y){
      if(powerUp.type === 'speed'){
        speedBoostUntil = Date.now() + 5000;
        spawnParticles(head.x * CELL + CELL/2, head.y * CELL + CELL/2, COLORS.speed, 40);
      } else if(powerUp.type === 'double'){
        doubleScoreUntil = Date.now() + 8000;
        spawnParticles(head.x * CELL + CELL/2, head.y * CELL + CELL/2, COLORS.double, 40);
      }
      powerUp = null;
      clearTimeout(powerUpTimer);
      updatePowerIcon();
    }

    if(!ate) snake.pop();

    currentInterval = Date.now() < speedBoostUntil ? levelInterval * 0.55 : levelInterval;
    maybeSpawnPowerUp();
    updatePowerIcon();
  }

  // ---- ذرات ----
  function spawnParticles(x, y, color, count=30){
    for(let i=0;i<count;i++){
      const angle = Math.random() * 2 * Math.PI;
      const speed = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.008 + Math.random() * 0.02,
        color: color,
        size: 2 + Math.random() * 4
      });
    }
  }

  function updateParticles(){
    for(let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= p.decay;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  // ---- کامبو ----
  let comboTimeout = null;
  function showCombo(count){
    comboText.textContent = `🔥 ${count}x COMBO!`;
    comboText.classList.add('show');
    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => comboText.classList.remove('show'), 1200);
  }

  // ---- رسم ----
  function pathRoundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  function darkenColor(hex, factor){
    let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    r=Math.floor(r*factor); g=Math.floor(g*factor); b=Math.floor(b*factor);
    return `rgb(${r},${g},${b})`;
  }

  function applyFilter(){
    const filters = {
      normal: 'none',
      cinema: 'contrast(0.9) saturate(0.7) sepia(0.15)',
      neon: 'contrast(1.2) saturate(1.8) hue-rotate(-10deg)',
      mono: 'grayscale(0.95) sepia(0.2) contrast(1.1)'
    };
    canvas.style.filter = filters[currentFilter] || 'none';
  }

  function drawGlowCell(cell, color, glow, size=null){
    if(!cell) return;
    const x = cell.x * CELL, y = cell.y * CELL;
    const sz = size || CELL-4;
    const offset = (CELL - sz)/2;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow * 1.2;
    ctx.fillStyle = color;
    pathRoundedRect(x+offset, y+offset, sz, sz, 4);
    ctx.fill();
    ctx.shadowBlur = glow * 0.6;
    ctx.shadowColor = 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.restore();
  }

  function drawSnakeCell(cell, isHead){
    if(!cell) return;
    const x = cell.x * CELL, y = cell.y * CELL;
    const color = isHead ? skin.color : darkenColor(skin.color, 0.65);
    const glow = isHead ? 16 : 8;
    const sz = isHead ? CELL-3 : CELL-5;
    const offset = (CELL - sz)/2;

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.fillStyle = color;
    pathRoundedRect(x+offset, y+offset, sz, sz, 4);
    ctx.fill();
    ctx.shadowBlur = glow * 0.4;
    ctx.shadowColor = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.restore();

    if(!isHead && skin.pattern !== 'simple'){
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#fff';
      const p = skin.pattern;
      if(p === 'dotted'){
        for(let i=0;i<3;i++){
          for(let j=0;j<3;j++){
            if((i+j)%2===0){
              ctx.beginPath();
              ctx.arc(x + CELL/2 + (i-1)*CELL*0.25, y + CELL/2 + (j-1)*CELL*0.25, 2, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
      } else if(p === 'striped'){
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        for(let i=-1;i<=1;i++){
          ctx.beginPath();
          ctx.moveTo(x + CELL/2 + i*CELL*0.3, y + 2);
          ctx.lineTo(x + CELL/2 + i*CELL*0.3, y + CELL - 2);
          ctx.stroke();
        }
      } else if(p === 'checkered'){
        for(let i=0;i<2;i++){
          for(let j=0;j<2;j++){
            if((i+j)%2===0){
              ctx.fillRect(x + i*CELL/2 + 2, y + j*CELL/2 + 2, CELL/2 - 4, CELL/2 - 4);
            }
          }
        }
      }
      ctx.restore();
    }

    if(isHead){
      ctx.save();
      ctx.fillStyle = '#05060a';
      ctx.font = `bold ${CELL * 0.55}px "Vazirmatn", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(skin.letter, x + CELL/2, y + CELL/2 + 2);
      ctx.restore();
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.15)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      pathRoundedRect(x+4, y+4, CELL-8, CELL-8, 4);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = isDay ? '#e8edf2' : '#05060a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = isDay ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for(let i=0;i<=COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
    }
    for(let j=0;j<=ROWS;j++){
      ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke();
    }

    if(!food) spawnFood();
    if(obstacles.length === 0) spawnObstacles(3);

    obstacles.forEach(o => drawGlowCell(o, COLORS.obstacle, 10));
    if(food) drawGlowCell(food, COLORS.food, 16);
    if(powerUp){
      const c = powerUp.type === 'speed' ? COLORS.speed : COLORS.double;
      drawGlowCell(powerUp, c, 18);
    }

    if(snake && snake.length > 0){
      snake.forEach((s,i) => drawSnakeCell(s, i===0));
    } else {
      const fallbackSnake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
      fallbackSnake.forEach((s,i) => drawSnakeCell(s, i===0));
    }

    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life * 0.8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    applyFilter();
  }

  // ---- حلقه اصلی ----
  function loop(ts){
    if(!running){
      rafId = requestAnimationFrame(loop);
      return;
    }
    if(!paused && ts - lastStep >= currentInterval){
      lastStep = ts;
      step();
    }
    updateParticles();
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // ---- کنترل pause ----
  function togglePause(){
    if(!running) return;
    paused = !paused;
    pauseOverlay.classList.toggle('hidden', !paused);
    pauseBtn.textContent = paused ? '▶ ادامه' : '⏸ توقف';
    if(!paused) lastStep = performance.now();
  }
  pauseBtn.addEventListener('click', togglePause);

  // ---- شروع ----
  function start(){
    reset();
    running = true;
    paused = false;
    pauseOverlay.classList.add('hidden');
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    pauseBtn.textContent = '⏸ توقف';
    lastStep = performance.now();
    draw();
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  // ---- ورودی کیبورد ----
  const KEY_DIR = {
    arrowup:{x:0,y:-1}, arrowdown:{x:0,y:1}, arrowleft:{x:-1,y:0}, arrowright:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
  };
  function trySetDir(d){
    if(!d) return;
    if(d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }
  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if(KEY_DIR[key]){ e.preventDefault(); trySetDir(KEY_DIR[key]); }
    if(e.key === ' ' || e.key === 'Space'){ e.preventDefault(); togglePause(); }
  });

  // ============================================================
  //  کنترل جوی‌استیک (بدون دکمه‌های اضافی)
  // ============================================================

  // ---- جابجایی جوی‌استیک با درگ ----
  function startDrag(e){
    e.preventDefault();
    isDraggingJoystick = true;
    const rect = joystickWrapper.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragOffsetX = clientX - rect.left;
    dragOffsetY = clientY - rect.top;
    joystickWrapper.classList.add('dragging');
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag, {passive: false});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
  }

  function onDrag(e){
    e.preventDefault();
    if(!isDraggingJoystick) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    let left = clientX - dragOffsetX;
    let top = clientY - dragOffsetY;
    const wrapperSize = joystickWrapper.offsetWidth || 140;
    left = Math.max(0, Math.min(window.innerWidth - wrapperSize, left));
    top = Math.max(0, Math.min(window.innerHeight - wrapperSize, top));
    joystickWrapper.style.left = left + 'px';
    joystickWrapper.style.top = top + 'px';
  }

  function endDrag(e){
    isDraggingJoystick = false;
    joystickWrapper.classList.remove('dragging');
    saveJoystickPosition();
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchend', endDrag);
  }

  joystickHandle.addEventListener('mousedown', startDrag);
  joystickHandle.addEventListener('touchstart', startDrag, {passive: false});

  // ---- ذخیره و بازیابی موقعیت جوی‌استیک ----
  function loadJoystickPosition(){
    try {
      const pos = localStorage.getItem('joystick_position');
      if(pos){
        const {x,y} = JSON.parse(pos);
        joystickWrapper.style.left = x + 'px';
        joystickWrapper.style.top = y + 'px';
      } else {
        joystickWrapper.style.left = '20px';
        joystickWrapper.style.top = (window.innerHeight - 160) + 'px';
      }
    } catch(e){
      joystickWrapper.style.left = '20px';
      joystickWrapper.style.top = (window.innerHeight - 160) + 'px';
    }
  }
  function saveJoystickPosition(){
    const rect = joystickWrapper.getBoundingClientRect();
    try {
      localStorage.setItem('joystick_position', JSON.stringify({x: rect.left, y: rect.top}));
    } catch(e){}
  }

  // ---- کنترل حرکت جوی‌استیک ----
  function handleJoystickStart(e){
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const rect = joystickBase.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    joystickActive = true;
    joystickAnchor = {x: cx, y: cy};
    updateJoystickPosition(touch.clientX, touch.clientY);
  }

  function handleJoystickMove(e){
    e.preventDefault();
    if(!joystickActive) return;
    const touch = e.touches ? e.touches[0] : e;
    updateJoystickPosition(touch.clientX, touch.clientY);
  }

  function handleJoystickEnd(e){
    joystickActive = false;
    joystickStick.style.transform = 'translate(-50%,-50%)';
  }

  function updateJoystickPosition(clientX, clientY){
    const dx = clientX - joystickAnchor.x;
    const dy = clientY - joystickAnchor.y;
    const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
    const angle = Math.atan2(dy,dx);
    const stickX = (Math.cos(angle) * dist / JOY_RADIUS) * 45;
    const stickY = (Math.sin(angle) * dist / JOY_RADIUS) * 45;
    joystickStick.style.transform = `translate(${-50 + stickX}%, ${-50 + stickY}%)`;

    if(Math.hypot(dx,dy) < 15) return;
    const deg = angle * 180 / Math.PI;
    if(deg > -45 && deg <= 45) trySetDir({x:1,y:0});
    else if(deg > 45 && deg <= 135) trySetDir({x:0,y:1});
    else if(deg > -135 && deg <= -45) trySetDir({x:0,y:-1});
    else trySetDir({x:-1,y:0});
  }

  // رویدادهای جوی‌استیک
  joystickBase.addEventListener('touchstart', handleJoystickStart, {passive: false});
  joystickBase.addEventListener('touchmove', handleJoystickMove, {passive: false});
  joystickBase.addEventListener('touchend', handleJoystickEnd);
  joystickBase.addEventListener('touchcancel', handleJoystickEnd);
  joystickBase.addEventListener('mousedown', handleJoystickStart);
  document.addEventListener('mousemove', (e) => {
    if(joystickActive) handleJoystickMove(e);
  });
  document.addEventListener('mouseup', handleJoystickEnd);

  // ---- تم ----
  themeToggle.addEventListener('click', () => {
    isDay = !isDay;
    document.body.classList.toggle('day-mode', isDay);
    themeToggle.textContent = isDay ? '☀️' : '🌙';
    document.querySelectorAll('.star').forEach(el => {
      el.style.background = isDay ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.6)';
    });
  });

  // ---- تمام‌صفحه ----
  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
    } else {
      document.exitFullscreen?.() || document.webkitExitFullscreen?.();
    }
  });

  // ---- شخصی‌سازی ----
  document.getElementById('skinLetter').addEventListener('input', function(){
    let l = this.value.trim().toUpperCase();
    if(l.length === 0) l = '?';
    skin.letter = l;
  });
  document.getElementById('skinColor').addEventListener('input', function(){
    skin.color = this.value;
  });
  document.getElementById('skinPattern').addEventListener('change', function(){
    skin.pattern = this.value;
  });

  // ---- فیلترها ----
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
    });
  });

  // ---- دکمه‌های شروع ----
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);

  // ---- مقداردهی اولیه ----
  loadJoystickPosition();
  reset();
  running = false;
  draw();

  window.addEventListener('resize', saveJoystickPosition);
})();
</script>
</body>
